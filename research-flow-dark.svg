<svg xmlns="http://www.w3.org/2000/svg" width="640" height="80" viewBox="0 0 640 80" role="img" aria-labelledby="title desc">
  <title id="title">AIPOCH: AI for scientific discovery. Open tools for curious minds. Built to move science forward.</title>
  <desc id="desc">A transparent, single-line research headline. Three phrases are typed, held for reading, and erased in turn, with a yellow cursor. A static version is shown when reduced motion is preferred.</desc>
  <style>
    text{font-family:"Roboto Mono",Consolas,"Liberation Mono",monospace;font-size:27px;font-weight:500;fill:#F7F7F4}
    .prompt{fill:#9D9D95;font-weight:400}
    .fallback{display:none}
    .phrase{opacity:0}
    .blink{animation:blink 1s steps(1,end) infinite}
    @keyframes blink{0%,65%{opacity:1}66%,100%{opacity:.18}}
    @keyframes window{0%,32.99%{opacity:1}33%,100%{opacity:0}}
    .phrase-0{animation:window 15s infinite;animation-delay:0s}
    .reveal-0{animation:write-0 15s infinite both;animation-delay:0s}
    .caret-0{animation:travel-0 15s infinite both;animation-delay:0s}
    @keyframes write-0{
      0%{width:0;animation-timing-function:steps(28,end)}
      10%{width:448px;animation-timing-function:linear}
      25%{width:448px;animation-timing-function:steps(28,end)}
      30%,100%{width:0}
    }
    @keyframes travel-0{
      0%{transform:translateX(0);animation-timing-function:steps(28,end)}
      10%{transform:translateX(448px);animation-timing-function:linear}
      25%{transform:translateX(448px);animation-timing-function:steps(28,end)}
      30%,100%{transform:translateX(0)}
    }
.phrase-1{animation:window 15s infinite;animation-delay:5s}
    .reveal-1{animation:write-1 15s infinite both;animation-delay:5s}
    .caret-1{animation:travel-1 15s infinite both;animation-delay:5s}
    @keyframes write-1{
      0%{width:0;animation-timing-function:steps(29,end)}
      10%{width:464px;animation-timing-function:linear}
      25%{width:464px;animation-timing-function:steps(29,end)}
      30%,100%{width:0}
    }
    @keyframes travel-1{
      0%{transform:translateX(0);animation-timing-function:steps(29,end)}
      10%{transform:translateX(464px);animation-timing-function:linear}
      25%{transform:translateX(464px);animation-timing-function:steps(29,end)}
      30%,100%{transform:translateX(0)}
    }
.phrase-2{animation:window 15s infinite;animation-delay:10s}
    .reveal-2{animation:write-2 15s infinite both;animation-delay:10s}
    .caret-2{animation:travel-2 15s infinite both;animation-delay:10s}
    @keyframes write-2{
      0%{width:0;animation-timing-function:steps(30,end)}
      10%{width:480px;animation-timing-function:linear}
      25%{width:480px;animation-timing-function:steps(30,end)}
      30%,100%{width:0}
    }
    @keyframes travel-2{
      0%{transform:translateX(0);animation-timing-function:steps(30,end)}
      10%{transform:translateX(480px);animation-timing-function:linear}
      25%{transform:translateX(480px);animation-timing-function:steps(30,end)}
      30%,100%{transform:translateX(0)}
    }
    @media(prefers-reduced-motion:reduce){.animated{display:none}.fallback{display:block}}
  </style>
  <g class="animated"><g class="phrase phrase-0">
      <text class="prompt" x="77" y="46">›</text>
      <clipPath id="clip-0" clipPathUnits="userSpaceOnUse"><rect class="reveal-0" x="106" y="16" width="0" height="42"/></clipPath>
      <g clip-path="url(#clip-0)"><text x="106" y="46" textLength="448" lengthAdjust="spacingAndGlyphs">AI for scientific discovery.</text></g>
      <g class="caret-0"><rect class="blink" x="108" y="22" width="3" height="29" rx="1" fill="#F1DD67"/></g>
    </g>
<g class="phrase phrase-1">
      <text class="prompt" x="69" y="46">›</text>
      <clipPath id="clip-1" clipPathUnits="userSpaceOnUse"><rect class="reveal-1" x="98" y="16" width="0" height="42"/></clipPath>
      <g clip-path="url(#clip-1)"><text x="98" y="46" textLength="464" lengthAdjust="spacingAndGlyphs">Open tools for curious minds.</text></g>
      <g class="caret-1"><rect class="blink" x="100" y="22" width="3" height="29" rx="1" fill="#F1DD67"/></g>
    </g>
<g class="phrase phrase-2">
      <text class="prompt" x="61" y="46">›</text>
      <clipPath id="clip-2" clipPathUnits="userSpaceOnUse"><rect class="reveal-2" x="90" y="16" width="0" height="42"/></clipPath>
      <g clip-path="url(#clip-2)"><text x="90" y="46" textLength="480" lengthAdjust="spacingAndGlyphs">Built to move science forward.</text></g>
      <g class="caret-2"><rect class="blink" x="92" y="22" width="3" height="29" rx="1" fill="#F1DD67"/></g>
    </g></g>
  <g class="fallback">
    <text class="prompt" x="61" y="46">›</text>
    <text x="90" y="46" textLength="480" lengthAdjust="spacingAndGlyphs">Built to move science forward.</text>
    <rect x="572" y="22" width="3" height="29" rx="1" fill="#F1DD67"/>
  </g>
</svg>